<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFC Carreira — Simulador de MMA Completo</title>
<style>
:root{
  --bg:#0d0a14;--p:#181224;--p2:#221a33;--l:#3a2d55;--t:#f1ecf8;--m:#a99bc2;
  --a:#a855f7;--g:#3bd28b;--r:#ef6262;--y:#e4bb55;color-scheme:dark
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(900px 500px at 50% -10%,#2a1450,transparent 60%),var(--bg);
  color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45
}

/* ===== TOP / BRAND (estilo futebol) ===== */
.top{
  position:sticky;top:0;z-index:10;
  background:#0d0a14ee;border-bottom:1px solid var(--l);
  padding:10px 14px 8px;backdrop-filter:blur(8px)
}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:900;letter-spacing:-.3px}
.brand .sub{color:var(--m);font-size:12px;margin-top:2px}
.brand-stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brand-pill{
  background:var(--p2);border:1px solid var(--l);border-radius:999px;
  padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap
}
.brand-pill b{color:var(--a)}

/* ===== NAV (ícone + texto + descrição) ===== */
.navWrap{
  display:flex;align-items:center;gap:6px;margin-top:8px;
  position:relative;
}
.navArrow{
  flex:none;width:36px;height:44px;padding:0;
  border-radius:12px;background:var(--p2);border:1px solid var(--l);
  color:var(--t);font-size:18px;cursor:pointer;z-index:2;
  display:grid;place-items:center;
}
.navArrow:hover{border-color:var(--a);color:var(--a)}
.navArrow:disabled{opacity:.25;cursor:default}
.navScroll{
  flex:1;min-width:0;
  display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--a) transparent;
  -webkit-overflow-scrolling:touch;
  padding:2px 2px 6px;
  mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);
}
.navScroll::-webkit-scrollbar{height:4px}
.navScroll::-webkit-scrollbar-thumb{background:var(--a);border-radius:4px}
nav{display:contents}
nav button.mainNavItem{
  display:flex;align-items:center;gap:8px;
  flex:none;min-width:max-content;padding:8px 12px;
  background:var(--p);color:var(--t);
  border:1px solid var(--l);border-radius:12px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .15s
}
nav button.mainNavItem:hover{border-color:var(--a);transform:translateY(-1px)}
nav button.mainNavItem.active{
  background:var(--a);border-color:var(--a);color:#14061f
}
nav button.mainNavItem.active .navText small{color:#3a1a4a}
nav button.mainNavItem.active .navChevron{color:#14061f}
.navIcon{font-size:18px;line-height:1;flex-shrink:0}
.navText{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.navText b{font-size:12px;font-weight:800}
.navText small{font-size:10px;color:var(--m);font-weight:500;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navChevron{font-size:14px;opacity:.5;margin-left:2px}

button,select,input{font:inherit}
button{
  color:var(--t);background:var(--p2);border:1px solid var(--l);
  border-radius:10px;padding:9px 13px;cursor:pointer
}
button:hover:not(:disabled){border-color:var(--a)}
button.pri,button.primary{background:var(--a);border-color:var(--a);color:#14061f;font-weight:800}
button:disabled{opacity:.4;cursor:not-allowed}
button.warn{background:#3a2a12;border-color:var(--y);color:var(--y)}
button.danger{background:#2a1218;border-color:var(--r);color:var(--r)}
select,input{
  background:#0b0712;color:var(--t);border:1px solid var(--l);
  border-radius:9px;padding:10px;width:100%
}

main{max-width:1100px;margin:auto;padding:14px 16px 90px}
.page{display:none}
.page.active{display:block;animation:pageIn .22s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{
  background:var(--p);border:1px solid var(--l);border-radius:14px;
  padding:15px;margin-bottom:12px
}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:12px 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.stat,.st{
  background:var(--p2);border:1px solid var(--l);border-radius:11px;padding:11px
}
.stat small,.st small{color:var(--m);display:block;font-size:11px}
.stat b,.st b,.big{font-size:19px;font-weight:900}
.bar{height:7px;background:#0a0710;border-radius:9px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--a);transition:width .2s}
.bar.r i{background:var(--r)}.bar.g i{background:var(--g)}.bar.y i{background:var(--y)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff0d}
.m,.muted{color:var(--m)}.w,.up{color:var(--g)}.d,.down{color:var(--r)}.y{color:var(--y)}
.badge{
  display:inline-block;background:var(--p2);border:1px solid var(--l);
  border-radius:8px;padding:3px 8px;font-size:11px;margin:2px
}
.badge.g{border-color:var(--g);color:var(--g)}
.badge.r{border-color:var(--r);color:var(--r)}
.badge.y{border-color:var(--y);color:var(--y)}
.badge.a{border-color:var(--a);color:var(--a)}

.ov{
  position:fixed;inset:0;background:#000c;z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto
}
.ov .box{position:relative;z-index:201}
.ov .acts button{pointer-events:auto;cursor:pointer;position:relative;z-index:202}

.ov[hidden]{display:none}
.box{
  width:min(680px,100%);background:var(--p);border:1px solid var(--a);
  border-radius:18px;padding:18px;margin:auto
}
.log{
  max-height:200px;overflow:auto;font-size:13px;color:#d9cfec;
  border-top:1px solid var(--l);margin-top:10px;padding-top:8px
}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
.notice{
  padding:11px;background:#1a1230;border-left:4px solid var(--a);
  border-radius:8px;margin:10px 0;font-size:13px
}
.notice.bad{border-color:var(--r);background:#1a1018}
.notice.good{border-color:var(--g);background:#0f1a14}
.notice.warn{border-color:var(--y);background:#1a1610}
.me{background:#1e1530;font-weight:800}

/* Botão flutuante (como no futebol) */
#floatingAdvance{display:none;align-items:center;gap:6px;white-space:nowrap;padding:8px 14px;font-weight:800;box-shadow:none}
#floatingAdvance.show{display:inline-flex}

/* ===== CRIAÇÃO DE LUTADOR: layout organizado ===== */
.creation-card{
  max-width:1000px;margin:22px auto 0;padding:clamp(18px,3vw,30px);
  background:linear-gradient(145deg,#211631 0%,#181224 62%,#171020 100%);
  border-color:#493365;box-shadow:0 18px 50px #0003
}
.creation-head{max-width:760px;margin-bottom:22px}
.creation-kicker{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;
  color:#d9b7ff;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase
}
.creation-card h2{font-size:clamp(22px,3vw,28px);letter-spacing:-.6px;margin-bottom:7px}
.creation-head p{margin:0;color:#b9accd;line-height:1.65;font-size:14px}
.creation-section-title{
  margin:20px 0 10px;color:#d8c6ef;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px
}
.creation-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px 13px}
.creation-field{min-width:0}
.creation-field label{display:block;margin-bottom:6px;font-size:12px;font-weight:750;color:#c7b8dd}
.creation-field input,.creation-field select{min-height:46px;border-radius:11px;padding:10px 12px}
.creation-field small{display:block;margin-top:7px;font-size:11px;line-height:1.5;color:#a99bc2}
.creation-field.profile-field{grid-column:span 2}
.creation-field.style-field{grid-column:span 2}
.creation-footer{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-top:1px solid #ffffff12;margin-top:23px;padding-top:18px
}
.creation-footer p{margin:0;font-size:12px;color:#b9accd}
.creation-footer button{min-height:48px;padding:12px 22px;border-radius:12px}
.creation-card .pri{box-shadow:0 7px 20px #a855f733}
.creation-card .pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
@media(max-width:760px){
  .creation-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 10px}
  .creation-field.profile-field,.creation-field.style-field{grid-column:span 2}
}
@media(max-width:600px){
  main{padding:10px 10px 24px}
  .top{padding:8px 10px 6px}
  .brand h1{font-size:16px}
  .brand .sub{font-size:11px}
  .navWrap{margin-top:6px;gap:4px}
  .navArrow{width:32px;height:40px;font-size:16px}
  nav button.mainNavItem{padding:7px 10px;border-radius:10px}
  .navIcon{font-size:16px}
  .navText b{font-size:11px}
  .navText small{display:none}
  .navChevron{display:none}
  .card{padding:12px;border-radius:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .stat b,.st b,.big{font-size:17px}
  #floatingAdvance{width:100%;justify-content:center}
}

.risk-slider-labels{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;margin:16px 0 6px}.risk-slider{width:100%;height:16px;accent-color:#b45b43;cursor:pointer;background:linear-gradient(90deg,#238b57 0%,#91b95a 25%,#d7b64b 50%,#d9783d 75%,#bd3434 100%);border-radius:20px;appearance:none;-webkit-appearance:none}.risk-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border:3px solid white;border-radius:50%;background:#252033;box-shadow:0 1px 5px #0008}.risk-slider::-moz-range-thumb{width:16px;height:16px;border:3px solid white;border-radius:50%;background:#252033;box-shadow:0 1px 5px #0008}

/* Impacto visual ao errar uma reação no modo dinâmico */
#impactFlash{position:fixed;inset:0;z-index:9999;pointer-events:none;background:rgba(255,20,35,0);opacity:0}
#impactFlash.hit{animation:impactRedFlash .42s ease-out}
body.impactShake{animation:impactShake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes impactRedFlash{0%{opacity:0;background:rgba(255,10,25,0)}15%{opacity:1;background:rgba(255,0,25,.48)}38%{opacity:.75;background:rgba(255,15,25,.27)}65%{opacity:.25;background:rgba(255,0,25,.12)}100%{opacity:0;background:rgba(255,0,25,0)}}
@keyframes impactShake{0%,100%{transform:translate(0,0) rotate(0)}12%{transform:translate(-7px,3px) rotate(-.35deg)}25%{transform:translate(6px,-3px) rotate(.3deg)}38%{transform:translate(-5px,-2px) rotate(-.25deg)}52%{transform:translate(5px,2px) rotate(.2deg)}68%{transform:translate(-3px,1px)}82%{transform:translate(2px,-1px)}}
@media(prefers-reduced-motion:reduce){body.impactShake{animation:none}#impactFlash.hit{animation-duration:.15s}}

</style>
</head>
<body>
<div id="impactFlash" aria-hidden="true"></div>

<div class="top">
  <div class="brand">
    <div>
      <h1>🥊 UFC Carreira</h1>
      <div class="sub" id="brandSub">Simulador de MMA · carreira completa</div>
    </div>
    <div class="brand-stats" id="brandStats"></div>
    <button id="floatingAdvance" class="pri" type="button" onclick="advanceWeek()" title="Avança 1 semana no calendário">⏭ Avançar semana</button>
  </div>
  <div class="navWrap">
    <button type="button" class="navArrow" id="navPrev" aria-label="Anterior" onclick="scrollNav(-1)">‹</button>
    <div class="navScroll" id="navScroll">
      <nav id="nav"></nav>
    </div>
    <button type="button" class="navArrow" id="navNext" aria-label="Próximo" onclick="scrollNav(1)">›</button>
  </div>
</div>

<main id="m"></main>


<div class="ov" id="ov" hidden><div class="box" id="bx"></div></div>

  'Jiu-jitsu':'Especialista em jiu-jítsu: busca finalizações com frequência e melhora ataques de grappling; trocação mais fraca.',

function genCompOffers(force){

function advanceCompAfterFight(won){
  if(!S||!S.competition)return;
  const c=S.competition;
  if(won){
    c.wins++;

      // campeão do torneio
      const prize=c.purse[c.purse.length-1];
      const fameGain=c.fame[c.fame.length-1]||10;
      S.money+=prize;
      S.fame+=fameGain;
      S.titles.push({name:c.title+' ('+c.name+')',def:0,season:S.season,comp:true});
      addEvent('🏆 Campeão de '+c.name+' — '+c.title+' · '+usd(prize)+(c.international?' (crossover: ranking UFC preservado)':''));
      if(!S.calendar)S.calendar=[];
      S.calendar.unshift({type:'title',label:'🏆 '+c.title,week:S.week,season:S.season,purse:prize});
      // Contender win can bump stage
      if(c.id==='contender_tourney'&&S.stage===1){S.stage=2;S.rank=15;addEvent('Contrato UFC via Contender Tournament!')}
      if(c.id==='eliminator'&&S.stage===2){S.rank=1;addEvent('Você é o desafiante nº1!')}
      S.competition=null;
      toast('🏆 Título: '+c.title);
      return;
    }
    c.round++;
    const delay=c.weeksBetween||2;
    let w=S.week+delay,se=S.season;
    if(w>52){w-=52;se++}
    c.nextWeek=w;c.nextSeason=se;
    // bolsa parcial por avançar
    const mid=c.purse[Math.min(c.round-2,c.purse.length-1)]||0;
    if(mid){S.money+=Math.round(mid*0.25)}
    bookCompFight();
    addEvent(c.name+': avançou à rodada '+c.round+'/'+c.rounds);
    toast(c.name+' · Rodada '+c.round+'/'+c.rounds+' marcada');
  } else {
    addEvent('Eliminado de '+c.name+' na rodada '+c.round);
    if(!S.calendar)S.calendar=[];
    S.calendar.unshift({type:'comp',label:'Eliminado: '+c.name,week:S.week,season:S.season});
    S.competition=null;
    toast('Eliminado de '+c.name);
  }
}

  const potential=cl(Number(S&&S.potential)||75,50,100);
  const xpMultiplier=1.12-(potential-50)*0.004;
  return Math.max(25,Math.floor((40+lv*18+Math.pow(lv,1.35)*6)*xpMultiplier));
}
function xpProgress(){

function coachPointsPerLevel(){

  // A curva de custo dos atributos (2 pts a partir de 85 e 3 a partir de 90) limita abusos.
  const lvl=Math.max(0,Math.min(COACH_LVLS.length-1,Number(S&&S.coachLvl)||0));
  const maxPoints=[1,2,3,4,5][lvl];

function gainXP(amount,reason){
  if(!S||S.dead)return;
  S.xp=(S.xp||0)+amount;
  let ups=0,earned=0;
  while(S.xp>=xpToLevel(S.xpLevel||1)){
    S.xp-=xpToLevel(S.xpLevel||1);
    S.xpLevel=(S.xpLevel||1)+1;
    const points=coachPointsPerLevel();
    S.xpPoints=(S.xpPoints||0)+points;
    earned+=points;ups++;
  }
  if(ups){
    const msg='Level up! Nível '+(S.xpLevel)+' (+'+earned+' ponto(s) de atributo; treinador '+coach().name+')';
    addEvent(msg);toast('⬆ Level '+S.xpLevel+' · +'+earned+' ponto(s) de atributo');
  } else if(reason)toast('+'+amount+' XP'+(reason?' ('+reason+')':''));
}
function spendXPPoint(attr){

function weekIndex(season,week){

}
function syncBookedDate(){
  // Corrige agendas antigas/inconsistentes sem punir o jogador.
  if(!S||!S.booked)return;
  const now=weekIndex(S.season,S.week), due=weekIndex(S.booked.season,S.booked.week);
  if(due<now){
    S.booked.season=S.season;S.booked.week=S.week;
    if(S.booked.fromComp&&S.competition){S.competition.nextSeason=S.season;S.competition.nextWeek=S.week;}
    addEvent('Calendário sincronizado: luta mantida disponível nesta semana, sem multa.');
  }
}
function tickWeek(n=1,opts={}){
  if(!S)return false;
  n=Math.max(0,Math.floor(Number(n)||0));
  // Datas antigas ou inconsistentes nunca geram multa automática: mantém a luta disponível.
  if(!opts.fromFight)syncBookedDate();
  if(!opts.fromFight && S.booked && weekIndex(S.season,S.week)===weekIndex(S.booked.season,S.booked.week)){
    const why=injuryActive()?'lesão':sickActive()?'doença':null;
    if(why)postponeFight(S.booked,why);
    else { if(typeof toast==='function')toast('Sua luta contra '+S.booked.opp.n+' é nesta semana. Entre no octógono antes de avançar o calendário.'); return false; }
  }
  for(let i=0;i<n;i++){
    // Calcule a próxima semana antes de avançar. Nunca ultrapasse a data da luta,
    // mesmo se uma ação tentar avançar várias semanas de uma vez.
    let nextWeek=(S.week||1)+1, nextSeason=S.season||1;
    if(nextWeek>52){nextWeek=1;nextSeason++;}
    if(!opts.fromFight && S.booked && weekIndex(nextSeason,nextWeek)>weekIndex(S.booked.season,S.booked.week)){
      // Estado legado: se a luta já ficou para trás, sincroniza sem no-show.
      syncBookedDate();
      if(weekIndex(nextSeason,nextWeek)>weekIndex(S.booked.season,S.booked.week))break;
    }
    S.week=nextWeek;S.season=nextSeason;S.weekTotal=(S.weekTotal||0)+1;
    S.age=+(S.age+1/52).toFixed(3);
    if(S.week===1)ufcRecordSeason(true);
    if(ufcState().signed){ufcSimulateRankings();ufcUpdateInactivity(1);}
    tickRelationshipsWeek();
    S.fatigue=cl(S.fatigue-rn(3,7),0,100);
    if(injuryActive()&&(S.age<32||(S.weekTotal%2===0))){S.injury.weeksLeft--;if(S.injury.weeksLeft<=0){addEvent('Recuperado da lesão ('+S.injury.type+').');S.injury=null}}
    if(sickActive()){S.sick.weeksLeft--;if(S.sick.weeksLeft<=0){addEvent('Recuperado de '+S.sick.type+'.');S.sick=null}}
    if(S.masterSponsor&&S.week%4===0)S.money+=Math.round(S.masterSponsor.pay/13);
    if(S.manager&&S.week%4===0){
      S.money-=S.manager.salary;S.managerScamWeeks=(S.managerScamWeeks||0)+4;
      if(S.manager.scamActive&&!S.manager.discovered&&S.managerScamWeeks>=8&&chance(0.12+S.manager.scam*0.16)){
        S.manager.discovered=true;S.manager.scamActive=false;S.agentMood=cl((S.agentMood||70)-12,0,100);S.manager.lastAction='Golpe descoberto; operações suspensas.';addEvent('Você descobriu que '+S.manager.name+' desviava dinheiro e encerrou o esquema.');
        if(typeof toast==='function')toast('🚨 Você descobriu o golpe do empresário!');
      } else if(S.manager.scamActive&&!S.manager.discovered){const theft=Math.round(S.manager.salary*(0.35+S.manager.scam));S.money-=theft;S.manager.lastAction='Movimentações suspeitas; sem novas negociações.';}
      else if(!S.manager.discovered){manageSponsorshipsByManager();}
    }
    (S.smallContracts||[]).slice().forEach(c=>{
      c.weeksLeft--;
      if(S.week%4===0)S.money+=Math.round(c.pay);
      if(c.weeksLeft<=0){
        if(c.progress>=c.wins){S.money+=c.bonus;addEvent('Concluiu contrato com '+c.name+' e recebeu bônus de '+usd(c.bonus)+'.');}
        else addEvent('Contrato com '+c.name+' terminou sem cumprir a meta.');
        S.sponsorHistory.unshift({name:c.name,success:c.progress>=c.wins,season:S.season});S.smallContracts=S.smallContracts.filter(x=>x.id!==c.id);
      }
    });
    if(!opts.fromFight&&!sickActive()&&!injuryActive()&&chance(0.04+S.fatigue/500))catchSick();
    if(!opts.fromFight && S.booked && weekIndex(S.season,S.week)===weekIndex(S.booked.season,S.booked.week))break;
  }
  // Não chamar checkNoShow em avanço normal. No-show só pode ocorrer por ação
  // explícita do jogador; um avanço de calendário jamais aplica multa sozinho.
  if(!opts.fromFight&&chance(0.4+(S.agentMood||70)/200))genFightOffers(false);
  if(!opts.silent&&typeof randomEvent==='function')try{randomEvent()}catch(e){}
  return true;
}

function estimatePurse(opp){
  const s=S;
  const pref=Number.isFinite(Number(s.opponentPreference))?Number(s.opponentPreference):50;
  let purse;
  if(s.champ)purse=opp.title?rn(500,900)*1000:rn(280,450)*1000;
  else if(s.stage===2)purse=opp.title?180000:Math.round((12000+(16-(opp.rank||10))*2800)*(0.9+Math.random()*0.4));
  else if(s.stage===1)purse=rn(6,12)*1000;
  else purse=rn(1200,3500);

  // Desafios mais perigosos pagam um prêmio de risco real, inclusive no circuito regional.
  // Escala de preferência: 0% = 0,60x; 50% = 1,35x; 100% = 2,10x.
  const riskMultiplier=0.60+(pref/100)*1.50;
  // Um rival acima do nível do lutador também aumenta a bolsa; rivais fáceis não recebem bônus.
  const myRating=ovr();
  const opponentRating=Number(opp.rating)||ovr(opp.a);
  const ratingGap=cl(opponentRating-myRating,0,25);
  const challengeMultiplier=1+(ratingGap*0.025);
  purse *= riskMultiplier*challengeMultiplier;
  return Math.round(purse);
}

function ufcNormalizeRanking(){

    const ar=a.rank==null?999:Number(a.rank),br=b.rank==null?999:Number(b.rank);

function genFightOffers(force){
  if(!S||S.dead||S.retired)return;
  if(ufcState().signed){if(force||(!S.fightOffers||!S.fightOffers.some(x=>x.ufcContract)))genUfcOffers(true);return;}
  if(!S.fightOffers)S.fightOffers=[];
  // Remove ofertas cuja data já passou. Nunca devem continuar disponíveis para aceitar.
  S.fightOffers=S.fightOffers.filter(of=>of && Number.isFinite(+of.season) && Number.isFinite(+of.week) &&
    (+of.season>S.season || (+of.season===S.season && +of.week>=S.week)));
  genCompOffers(force);
  // se já tem luta marcada, agente não satura ofertas de luta avulsa
  if(S.booked && !force) return;
  if(S.competition && !force) return; // durante torneio, não empurra avulsas
  if(S.fightOffers.length>=3 && !force) return;
  const n = force?rn(1,2):(chance(0.55)?1:0);
  for(let i=0;i<n;i++){
    if(S.fightOffers.length>=4)break;
    const opp=mkOfferOpp();
    // Cada oferta recebe uma janela própria: evita que todas as lutas caiam na mesma semana.
    let delay=rn(2,8), week, season;
    let attempts=0;
    do {
      delay=rn(2,8); week=S.week+delay; season=S.season;
      while(week>52){week-=52;season++}
      attempts++;
    } while(attempts<30 && (S.fightOffers.some(x=>x.week===week&&x.season===season) || (S.booked&&S.booked.week===week&&S.booked.season===season)));
    // Se várias ofertas estiverem acumuladas, garante uma data futura diferente.
    if(S.fightOffers.some(x=>x.week===week&&x.season===season) || (S.booked&&S.booked.week===week&&S.booked.season===season)){
      delay=9+i+S.fightOffers.length; week=S.week+delay; season=S.season;
      while(week>52){week-=52;season++}
    }
    const purse=estimatePurse(opp);
    const fine=Math.round(purse*0.35+rn(2000,12000));
    const id='f'+Date.now()+'_'+rn(100,999)+'_'+i;
    const an=agentAnalyze(opp);
    S.fightOffers.push({id,opp,week,season,purse,fine,risk:an.risk,created:{w:S.week,s:S.season}});
  }
}
function acceptOffer(id){

  const idx=S.fightOffers.findIndex(x=>x.id===id);
  if(idx<0)return;
  const of=S.fightOffers[idx];
  // Validação no momento do clique, pois a tela pode ter ficado aberta enquanto o calendário avançou.
  const offerIsPast = !of || !Number.isFinite(+of.season) || !Number.isFinite(+of.week) ||
    (+of.season<S.season || (+of.season===S.season && +of.week<S.week));
  if(offerIsPast){
    S.fightOffers=S.fightOffers.filter(x=>x.id!==id);
    toast('Essa oferta venceu: a data prevista já passou. Peça ao agente uma nova luta.');
    genFightOffers(true); save(); ui(); return;
  }
  S.booked={...of,status:'booked'};
  S.opp=of.opp;
  S.fightOffers=S.fightOffers.filter(x=>x.id!==id);
  // remove outras ofertas conflitantes da mesma semana
  S.fightOffers=S.fightOffers.filter(x=>!(x.week===of.week&&x.season===of.season));
  if(!S.calendar)S.calendar=[];
  S.calendar.unshift({type:'booked',label:'Luta marcada vs '+of.opp.n,week:of.week,season:of.season,purse:of.purse});
  S.calendar=S.calendar.slice(0,40);
  addEvent('Agente marcou luta vs '+of.opp.n+' (T'+of.season+' S'+of.week+')');

  save();ui();
}

function dynamicPrompt(){
  if(!F||F.done)return;
  if(F.r>F.n){
    const a=F.c.reduce((s,x)=>s+x[0],0),b=F.c.reduce((s,x)=>s+x[1],0);
    return end(a!==b?a>b:F.hp>=F.hpo,'Decisão '+(Math.abs(a-b)>=F.n?'unânime':'dividida'));
  }
  if(F.hp<=0)return end(false,'KO/TKO');
  if(F.hpo<=0)return end(true,'KO/TKO');

  clearTimeout(F._qteT);
  // ~35% chance: dodge punch (very fast)
  if(chance(0.38)){
    const side=chance(0.5)?'L':'R'; // punch comes from this side
    const need=side==='L'?'R':'L'; // click opposite to dodge
    const gap=Math.max(0,(Number(F.o.rating)||ovr(F.o.a))-ovr());
    const rivalReaction=cl(1-gap*0.022,0.52,1);
    const ms=Math.max(650, Math.round((diff().qteMs||3000)*0.55*qteMul()*rivalReaction));
    F.qte={type:'dodge',side,need,deadline:Date.now()+ms,answered:false,ms};
    fightUIDynamic();
    F._qteT=setTimeout(()=>{if(F&&F.qte&&!F.qte.answered)resolveDodge(null)},ms);
    return;
  }
  const q=JSON.parse(JSON.stringify(pk(QTE_POOL)));
  // embaralha opções e relabela A/B/C para não vazar padrão
  for(let i=q.opts.length-1;i>0;i--){const j=rn(0,i);const t=q.opts[i];q.opts[i]=q.opts[j];q.opts[j]=t}
  q.opts.forEach((o,i)=>{o.k=['A','B','C'][i]});
  const gap=Math.max(0,(Number(F.o.rating)||ovr(F.o.a))-ovr());
  const rivalReaction=cl(1-gap*0.022,0.52,1);
  const ms=Math.max(750,Math.round((diff().qteMs||3000)*qteMul()*rivalReaction));
  F.qte={type:'choice',q,deadline:Date.now()+ms,answered:false,ms};
  fightUIDynamic();
  F._qteT=setTimeout(()=>{if(F&&F.qte&&!F.qte.answered)resolveQTE(null)},ms);
}

function resolveDodge(clicked){
  if(!F||!F.qte||F.qte.type!=='dodge'||F.qte.answered||F.done)return;
  F.qte.answered=true;clearTimeout(F._qteT);
  try{document.removeEventListener('keydown',window._qteKey)}catch(e){}
  const need=F.qte.need, side=F.qte.side;
  const ok=clicked===need;
  const p=S.a,o=F.o.a;
  let dO=0,dP=0,msg='';
  if(ok){
    F.qteStreak=(F.qteStreak||0)+1;
    dO=rn(2,7)+Math.min(4,F.qteStreak);
    dP=rn(0,2);
    msg='Esquiva limpa! Soco vinha da '+(side==='L'?'esquerda':'direita')+'.';
    F.qteBonus=(F.qteBonus||0)+4;
  } else {
    soundHit();
    triggerDynamicImpact();
    F.qteStreak=0;
    // heavy damage if miss / timeout
    dP=rn(14,26)+Math.floor((o.pwr||50)/15);
    dO=rn(0,3);
    msg=clicked?('Errou a esquiva! Soco da '+(side==='L'?'esquerda':'direita')+' acertou em cheio.'):('Não reagiu! Soco da '+(side==='L'?'esquerda':'direita')+' limpo.');
  }
  const pfx=styFx(S.sty),ofx=styFx(F.o.sty);
  dO=cl(Math.round(dO*diff().dmgOut*(0.9+p.spd/250)*(pfx.out||1)*(pfx.strikeOut||1))+(dO>0?pfx.flat:0),0,30);
  dP=cl(Math.round(dP*diff().dmgIn*(0.9+o.pwr/200)*(1-(p.df||50)/400)*(ofx.out||1)*(ofx.strikeOut||1)*(pfx.in||1)),0,36);
  if(ok&&pfx.counter&&chance(pfx.counter)){dO+=rn(3,7);msg+=' Contra-ataque do seu estilo!';}
  F.hpo-=dO;F.hp-=dP;
  F.st=cl(F.st-rn(3,8)-(pfx.drain||0),0,100);
  F.so=cl(F.so-(ofx.drain||0),0,100);
  F.log.unshift(`R${F.r} ESQUIVA: ${msg} Dano ${dO}/${dP}.`);
  const df=dO-dP+styFx(S.sty).pts-styFx(F.o.sty).pts;F.c.push(df>=6?[10,9]:df<=-6?[9,10]:[10,9]);
  if(F.hpo<=0)return end(true,'KO/TKO');
  if(F.hp<=0)return end(false,'KO/TKO');
  if(!ok&&dP>=20&&chance(0.1*diff().death))return end(false,'KO/TKO');
  F._qteCount=(F._qteCount||0)+1;
  if(F._qteCount%2===0)F.r++;
  if(F.r>F.n){
    const a=F.c.reduce((x,y)=>x+y[0],0),b=F.c.reduce((x,y)=>x+y[1],0);
    return end(a!==b?a>b:F.hp>=F.hpo,'Decisão '+(Math.abs(a-b)>=F.n?'unânime':'dividida'));
  }
  setTimeout(()=>dynamicPrompt(),320);
}

    const streakBonus=Math.min(6,F.qteStreak);
    if(effect==='slip'||effect==='escape'||effect==='sprawl'){dO=rn(4,10)+streakBonus;dP=rn(0,3);msg='Boa leitura! Você minimizou o dano e contra-atacou.'}
    else if(effect==='power'||effect==='elbows'||effect==='gnp'||effect==='body'){dO=rn(10,20)+streakBonus+Math.floor(p.pwr/20);dP=rn(1,5);msg='Acerto limpo! Dano pesado.';F.strikes++}
    else if(effect==='subhunt'){dO=rn(8,14);dP=rn(2,6);msg='Você caça a finalização...';F.grapples++;
      if(chance((0.12+p.gr/400)*(styFx(S.sty).subFin||1))){F.hpo=Math.max(0,F.hpo-dO);return end(true,'Finalização')}
    }
    else if(effect==='clinch'||effect==='breathe'||effect==='guard'){dO=rn(3,8);dP=rn(1,4);F.st=Math.min(100,F.st+8);msg='Você controlou a posição e recuperou fôlego.'}
    else {dO=rn(6,12);dP=rn(2,6);msg='Decisão correta.'}
    F.qteBonus=(F.qteBonus||0)+3+streakBonus;
  } else {
    F.qteStreak=0;
    if(effect==='taken'){dP=rn(10,18);dO=rn(1,4);msg='Você foi derrubado com facilidade.';F.grapples++}
    else if(effect==='trade'||effect==='gas'){dP=rn(9,16);dO=rn(5,11);msg='Troca perigosa — você se expôs.';F.strikes++}
    else if(effect==='stuck'||effect==='miss'){dP=rn(8,15);dO=rn(0,4);msg='Hesitação custou caro.'}
    else {dP=rn(7,14);dO=rn(2,7);msg='Escolha ruim.'}
  }

  // Atributos e estilos influenciam os dois lados no modo dinâmico.
  const pfx=styFx(S.sty),ofx=styFx(F.o.sty);
  const isPlayerStrike=['power','elbows','gnp','body','slip','escape','sprawl'].includes(effect);
  const isIncomingGrapple=effect==='taken';
  dO=cl(Math.round(dO*diff().dmgOut*(0.85+p.str/200+coach().bonus*0.03)*mfxDynamicOut(effect))+(dO>0&&isPlayerStrike?pfx.flat:0),0,28);
  dP=cl(Math.round(dP*diff().dmgIn*(0.85+o.str/200)*(ofx.out||1)*(isIncomingGrapple?(ofx.grappleOut||1):(ofx.strikeOut||1))*(pfx.in||1)),0,28);
  if(ok&&['slip','escape','sprawl'].includes(effect)&&pfx.counter&&chance(pfx.counter)){dO=cl(dO+rn(3,7),0,28);msg+=' Contra-ataque do seu estilo!';}
  F.hpo-=dO;F.hp-=dP;
  F.st=cl(F.st-rn(4,10)+(p.cd/25)-(pfx.drain||0),0,100);
  F.so=cl(F.so-rn(4,9)-(ofx.drain||0),0,100);

  F.log.unshift(`R${F.r} QTE: ${msg} Dano ${dO}/${dP}.`);
  const df=dO-dP+pfx.pts-ofx.pts;F.c.push(df>=8?[10,9]:df<=-8?[9,10]:[10,9]);

  if(F.hpo<=0)return end(true,'KO/TKO');
  if(F.hp<=0)return end(false,'KO/TKO');
  if(ok&&['power','elbows','body'].includes(effect)&&dO>=16&&chance((0.08+p.pwr/500)*(pfx.fin||1)))return end(true,'KO/TKO');
  if(!ok&&dP>=16&&chance(0.07))return end(false,'KO/TKO');

  // Avança round a cada 2 QTEs
  F._qteCount=(F._qteCount||0)+1;
  if(F._qteCount%2===0)F.r++;
  if(F.r>F.n){
    const a=F.c.reduce((x,y)=>x+y[0],0),b=F.c.reduce((x,y)=>x+y[1],0);
    return end(a!==b?a>b:F.hp>=F.hpo,'Decisão '+(Math.abs(a-b)>=F.n?'unânime':'dividida'));
  }
  setTimeout(()=>dynamicPrompt(),450);
}

      <button class="pri" style="min-height:72px;font-size:22px" onclick="resolveDodge('R')">DIREITA ➡️</button>

    window._qteKey=function(e){

      if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'||e.key==='3')resolveDodge('R');
    };
    document.removeEventListener('keydown',window._qteKey);
    document.addEventListener('keydown',window._qteKey);
    return;
  }
  const q=qte&&qte.q;
  const ms=(qte&&qte.ms)||3000;
  if(q){
    html+=`<div class="notice warn" style="margin-top:12px"><b>${q.title}</b><br><small class="m">Responda rápido!</small>
      <div id="qteBar" class="bar y" style="margin-top:8px;height:10px"><i id="qteFill" style="width:100%;background:var(--y);transition:none"></i></div>
    </div>

  html+=`<div class="log">${f.log.map(x=>`<div>${x}</div>`).join('')||'QTE: reaja rápido!'}</div>`;
  const o=$('ov'),b=$('bx');o.hidden=false;b.innerHTML=html;
  const fill=$('qteFill');
  if(fill){requestAnimationFrame(()=>{fill.style.transition='width '+ms+'ms linear';fill.style.width='0%'})}
  window._qteKey=function(e){
    const map={a:'A',b:'B',c:'C','1':'A','2':'B','3':'C'};
    const k=map[String(e.key).toLowerCase()];
    if(k)resolveQTE(k);
  };
  document.removeEventListener('keydown',window._qteKey);

}


function pw(a,d,t,stamina){
  a=a||{};d=d||{};
  const val=(obj,k)=>cl(Number(obj[k]??50),1,100);
  // Os atributos individuais influenciam diretamente cada tipo de ação.
  const atk=t==='strike'
    ?(val(a,'str')*1.45+val(a,'pwr')*.72+val(a,'spd')*.48+val(a,'df')*.12)
    :(val(a,'gr')*1.48+val(a,'cd')*.42+val(a,'str')*.20+val(a,'spd')*.18);
  const defn=t==='strike'
    ?(val(d,'df')*.72+val(d,'ch')*.36+val(d,'spd')*.28+val(d,'gr')*.10)
    :(val(d,'gr')*.62+val(d,'df')*.42+val(d,'cd')*.22+val(d,'spd')*.12);
  const staminaPct=cl((stamina==null?100:stamina)/100,0,1);
  const stam=.30+.70*staminaPct;
  // A diferença técnica precisa ser decisiva: atributos baixos não podem competir
  // de igual para igual com especialistas de elite só por escolher a ação certa.
  const technical=(atk-defn)*1.02;
  const overallGap=(ovr(a)-ovr(d));
  const overallImpact=overallGap*0.72;
  return (technical+overallImpact)*stam+rn(-5,5);
}
function oname0(){return ((F&&F.o&&F.o.n)||'Rival').split(' ')[0]}
function finisherCheck(dmg,t,a,d,hpd,sd,mul){
  if(dmg<10)return false;
  a=a||{};d=d||{};
  const base=t==='strike'?0.04+(100-hpd)/220+((a.str||50)+(a.pwr||50)-(d.ch||50))/500
    :0.035+(100-sd)/280+((a.gr||50)-(d.gr||50))/480;
  const gap=cl(((F&&F.o&&F.o.rating)||ovr())-ovr(),-30,30);
  const matchup= t==='strike' ? cl(1-gap*0.012,0.65,1.3) : cl(1-gap*0.009,0.7,1.25);
  return chance(base*formMul()*(mul||1)*matchup);
}
function fightRound(t){
  try{
    if(!F||F.done)return;
    if(!S||!S.a){toast('Erro: lutador inválido');return}
    if(!F.o||!F.o.a){toast('Erro: oponente inválido');return}
    const p=S.a,o=F.o.a;
    const ot=o.str>=o.gr?(chance(.7)?'strike':'grapple'):(chance(.7)?'grapple':'strike');
    let pp=t==='pace'?0.38*pw(p,o,'strike',F.st):pw(p,o,t,F.st);
    let op=pw(o,p,ot,F.so)*(t==='pace'?0.5:1);
    if(t==='grapple'&&ot==='strike')pp+=5;
    if(ot==='grapple'&&t==='strike')op+=5;
    try{pp+=(coach().bonus||0)}catch(e){}
    const mfx=styFx(S.sty),ofx=styFx(F.o.sty);let extra='';
    if(ot==='grapple')op-=mfx.tdDef;if(t==='grapple')pp-=ofx.tdDef;

    const ratingGap=cl((Number(F.o.rating)||ovr(o))-ovr(p),-35,35);
    // Diferença de OVR afeta fortemente a troca: +10 de OVR já é uma desvantagem séria.
    const playerDamageScale=cl(1-ratingGap*0.022,0.48,1.45);
    const rivalDamageScale=cl(1+ratingGap*0.025,0.48,1.65);
    let dO=cl(Math.round((pp*.36+rn(1,7))*playerDamageScale),0,34);
    let dP=cl(Math.round((op*.36+rn(1,7))*rivalDamageScale),0,34);
    try{
      dO=cl(Math.round(dO*(diff().dmgOut||1)),0,36);
      dP=cl(Math.round(dP*(diff().dmgIn||1)),0,36);
    }catch(e){}
    dO=cl(Math.round(dO*mfx.out*(t==='strike'?mfx.strikeOut:mfx.grappleOut)*ofx.in)+(t==='strike'&&dO>0?mfx.flat:0),0,42);
    dP=cl(Math.round(dP*ofx.out*(ot==='strike'?ofx.strikeOut:ofx.grappleOut)*mfx.in)+(ot==='strike'&&dP>0?ofx.flat:0),0,42);
    if(mfx.counter&&ot==='strike'&&t!=='grapple'&&chance(mfx.counter)){const c=rn(4,9);dO+=c;extra+=' Contra-ataque! +'+c+'.'}
    if(ofx.counter&&t==='strike'&&ot!=='grapple'&&chance(ofx.counter)){const c=rn(4,9);dP+=c;extra+=' '+oname0()+' contra-atacou! +'+c+'.'}

    if(dP>=8)soundHit();
    F.hpo-=dO;F.hp-=dP;
    F.st=t==='pace'?Math.min(100,F.st+12):cl(F.st-(15-(p.cd||50)/9),0,100);
    F.so=cl(F.so-(15-(o.cd||50)/9),0,100);
    if(t!=='pace')F.st=cl(F.st-mfx.drain,0,100);F.so=cl(F.so-ofx.drain,0,100);

    if(t==='strike')F.strikes=(F.strikes||0)+1;
    if(t==='grapple'){F.grapples=(F.grapples||0)+1;if(chance(.4))F.takedowns=(F.takedowns||0)+1}

    const TX={strike:'trocou golpes em pé',grapple:'levou a luta para o chão',pace:'controlou o ritmo e a distância'};
    const OX={strike:'atacou em pé',grapple:'buscou a queda'};
    const oname=(F.o.n||'Rival').split(' ')[0];
    F.log.unshift('R'+F.r+': você '+(TX[t]||t)+'; '+oname+' '+(OX[ot]||ot)+'. Dano '+dO+'/'+dP+'.'+extra);

    if(t!=='pace'&&finisherCheck(dO,t,p,o,F.hpo,F.so,t==='grapple'?mfx.subFin:mfx.fin))return endFight(true,t==='strike'?'KO/TKO':'Finalização');
    if(finisherCheck(dP,ot,o,p,F.hp,F.st,ot==='grapple'?ofx.subFin:ofx.fin))return endFight(false,ot==='strike'?'KO/TKO':'Finalização');
    if(F.hpo<=0)return endFight(true,'KO/TKO');
    if(F.hp<=0)return endFight(false,'KO/TKO');

    const df=dO-dP+rn(-4,4)+mfx.pts-ofx.pts;
    F.c.push(df>=16?[10,8]:df>=4?[10,9]:df<=-16?[8,10]:df<=-4?[9,10]:[10,9]);

    if(F.r>=F.n){
      const a=F.c.reduce((s,x)=>s+x[0],0),b=F.c.reduce((s,x)=>s+x[1],0);
      const win=a!==b?a>b:F.hp>=F.hpo;
      return endFight(win,'Decisão '+(Math.abs(a-b)>=F.n?'unânime':'dividida'));
    }
    F.r++;
    fightUI();
  }catch(err){
    console.error(err);
    toast('Erro na luta: '+(err&&err.message?err.message:err));
  }
}
function endFight(win,method){
  try{
    if(!F)return;
    // Registra antes de applyResult() limpar a luta marcada.
    const bookedFight = S && S.booked ? S.booked : null;
    F.isTournamentFight = !!(bookedFight && bookedFight.fromComp);
    F.isTitleFight = !!(F.o && F.o.title);
    F.done={win,method,rd:F.r};
    playResultJingle(!!win);
    applyResult();
    if(S&& !S.retired && !S.dead && (S.age>=40 || S.pendingRetirementReason)){retire(S.age>=40?'Limite de idade (40 anos)':S.pendingRetirementReason);return;}
    fightUI();
    // Derrota em torneio/campeonato sempre gera coletiva, exceto em caso de morte.
    // Lutas comuns continuam com coletiva ocasional, conforme fama.
    if(S && !S.dead && !S.retired && !F.pressAsked){
      F.pressAsked=true;
      const forcedChampionshipLoss = !win && (F.isTournamentFight || F.isTitleFight);
      F.pressAvailable = forcedChampionshipLoss || (S.fame>=25 && chance(0.24));
    }
  }catch(err){
    console.error(err);
    toast('Erro ao finalizar: '+(err&&err.message?err.message:err));
  }
}

function showPressConference(){
  if(!S||!F||!F.done||S.dead||S.retired)return;
  const win=!!F.done.win, opp=F.o||{n:'seu adversário'};

  const chosen=[];let candidates=pool.slice();

}

function applyResult(){
  const d=F.done,o=F.o,s=S,w=d.win;
  const isFin=d.method&&d.method[0]!=='D';
  let note='',purse;
  if(!o){console.error('applyResult: no opponent');return}

  if(w){s.w++;d.method[0]==='K'?s.ko++:d.method[0]==='F'?s.sub++:s.dec++;s.streak=Math.max(0,s.streak)+1}
  else{s.l++;s.streak=Math.min(0,s.streak)-1}

  if(S.booked&&S.booked.ufcContract)purse=S.booked.purse*(isFin?1:0.85);
  else if(s.champ)purse=isFin?900000:650000;
  else if(s.stage===2)purse=o.title?180000:(12000+(16-s.rank)*2800)*(isFin?1.35:1.15);
  else if(s.stage===1)purse=rn(6000,12000);
  else purse=rn(1200,3500);
  // A derrota paga somente 5% da bolsa-base anunciada para uma vitória.
  purse=Math.round(purse*(w?1:0.05));
  s.money+=purse;d.purse=purse;
  if(S.booked&&S.booked.ufcContract&&w){const u=ufcState();u.ufcPursesEarned=(u.ufcPursesEarned||0)+purse;}
  if(!s.careerSeasons)s.careerSeasons={};
  const seasonKey=String(s.season||1);if(!s.careerSeasons[seasonKey])s.careerSeasons[seasonKey]={wins:0,losses:0,fights:0};
  s.careerSeasons[seasonKey].fights++;if(w)s.careerSeasons[seasonKey].wins++;else s.careerSeasons[seasonKey].losses++;
  ufcRecordSeason(true);

  s.fame+=w?(s.stage+1)*4+(isFin?3:0)+(o.title?8:0):Math.max(0,2-s.stage);
  s.form=cl(s.form+(w?rn(4,10):-rn(6,14)),25,100);
  s.morale=cl(s.morale+(w?rn(5,12):-rn(8,18)),10,100);
  s.fatigue=cl(s.fatigue+rn(12,22)-(s.a.cd/20),0,100);
  s.fans+=w?rn(80,220)+(isFin?60:0):-rn(40,120);
  s.fightsSeason++;
  (s.smallContracts||[]).forEach(c=>{if(w)c.progress=(c.progress||0)+1;});
  if(s.manager&&!s.manager.discovered&&w&&chance(0.22)){const commission=Math.round((purse||0)*(s.manager.cut||0));s.money-=commission;addEvent('Comissão do empresário: '+usd(commission)+'.');}

  if(w){
    s.stageWins=(s.stageWins||0)+1;
    if(s.champ){s.def++;note='Cinturão defendido!';s.titles.push({name:s.div+' Championship',def:s.def,season:s.season})}
    else if(s.stage===0){s.sw++;if(s.stageWins>=6&&ovr()>=50){s.stage=1;s.sw=0;s.stageWins=0;note='Convite para o Contender Series! Você precisou de 6 vitórias e OVR 50+.';addEvent('Convite para o Contender Series após 6 vitórias e OVR 50+.')}else{note='Vitória no circuito local/regional. Progressão: '+s.stageWins+'/6 vitórias e OVR mínimo 50 para o Contender Series.'}}
    else if(s.stage===1){if(s.stageWins>=5&&ovr()>=65){s.stage=2;s.rank=30;s.stageWins=0;note='Contrato com o UFC! Você estreia fora do Top 15 e precisará provar seu valor.';addEvent('Assinou contrato com o UFC após 5 vitórias nacionais e OVR 65+.')}else{note='Vitória nacional. Para chegar ao UFC: '+s.stageWins+'/5 vitórias e OVR mínimo 65.'}}
    else if(o.title){s.champ=true;s.rank=1;s.def=0;note='VOCÊ É O CAMPEÃO DO UFC!';addEvent('Conquistou o cinturão de '+s.div+'.');s.titles.push({name:s.div+' Championship',def:0,season:s.season})}
    else{
      const expectedLevel=52+(16-(s.rank||10))*1.9;
      const skillGap=ovr()-expectedLevel;
      // Vitórias contra rivais fortes valem mais; vencer estando muito abaixo do nível
      // esperado melhora o ranking gradualmente, sem teletransporte para o topo.
      let climb=o.rank&&o.rank<s.rank?3:1+Math.floor(s.streak/3);
      if(skillGap>=8)climb+=2;
      else if(skillGap>=3)climb+=1;
      else if(skillGap<=-10)climb=Math.min(1,climb);
      s.rank=cl(s.rank-climb,1,30);note=s.rank<=15?'Ranking oficial: #'+s.rank:'Você está na posição '+s.rank+' da fila nacional; ainda fora do Top 15.';
    }
  }else{
    if(s.champ){s.champ=false;s.rank=2;note='Você perdeu o cinturão.';addEvent('Perdeu o cinturão de '+s.div+'.')}
    else if(s.stage===2){
      const expectedLevel=52+(16-(s.rank||10))*1.9;
      const skillGap=ovr()-expectedLevel;
      let drop=2+Math.floor(Math.abs(s.streak)/2);
      // Derrotas para alguém claramente acima do seu nível não punem tanto;
      // perder para alguém bem inferior custa mais posições.
      const opponentLevel=Number(o.rating)||ovr(o.a);
      if(opponentLevel>=ovr()+10)drop=Math.max(1,drop-1);
      if(opponentLevel<=ovr()-8)drop+=2;
      if(skillGap<=-10)drop=Math.max(1,drop-1);
      s.rank=cl(s.rank+drop,1,30);note=s.rank>15?'Você caiu para a posição '+s.rank+' da fila nacional.':'Ranking oficial: #'+s.rank;
    }
  }

  const opponentGap=(o.rating||ovr())-ovr();
  const pref=Number.isFinite(Number(s.opponentPreference))?Number(s.opponentPreference):50;
  const riskPref=(pref-50)*0.0018;
  const injuryChance=cl((w?0.08:0.18)+Math.max(0,opponentGap)*0.006+riskPref,0.03,0.48);
  if(chance(injuryChance)){
    const types=['corte','mão quebrada','costela','joelho','ombro','concussão leve'];
    const baseWeeks=rn(2,8);
    const weeks=baseWeeks+(s.age>=32?Math.floor((s.age-30)/2):0);
    const injuryType=pk(types);s.injury={type:injuryType,weeksLeft:weeks,orig:weeks};
    if(/quebrada|concussão/i.test(injuryType)){s.seriousInjuries=(s.seriousInjuries||0)+1;if(s.seriousInjuries>=3)s.pendingRetirementReason='Acúmulo de lesões graves';}
    note+=(note?' ':'')+'Lesão: '+s.injury.type+' ('+weeks+' semanas).';
    addEvent('Lesão: '+s.injury.type);
  }

  d.note=note;
  if(s.age>=32){
    const losses=s.age>=38?2:1;
    for(let n=0;n<losses;n++){const eligible=AT.map(([k])=>k).filter(k=>(s.a[k]||0)>35);if(eligible.length){const attr=pk(eligible);s.a[attr]=Math.max(35,s.a[attr]-1);}}
    addEvent('Declínio físico da idade ('+Math.floor(s.age)+' anos): recuperação e atributos começam a cair.');
  }
  s.peakOvr=Math.max(s.peakOvr,ovr());
  s.pts=4+Math.floor(s.a.cd/30)+Math.min(3,Math.floor((s.w+s.l)/8));

  // Derrota humilhante: trauma / morte rara
  const isKO=!w&&String(d.method).indexOf('KO')>=0;
  const humiliate=!w&&isKO&&(F.hp<=0||d.rd<=2||(o.rating-ovr())>=8);
  if(humiliate){
    const deathP=(0.012+(s.age>=32?(s.age-32)*0.004:0)+(F.hp<=0?0.01:0)+(d.rd===1?0.008:0)+((s.opponentPreference==='hard')?0.008:0)+Math.max(0,(o.rating||ovr())-ovr())*0.001)*diff().death;
    if(chance(deathP)){
      s.dead=true;s.retired=true;s.retireReason='Faleceu após derrota trágica no octógono';
      d.note=(d.note?d.note+' ':'')+'💀 Tragédia no octógono.';
      d.dead=true;addEvent('Morte após luta contra '+o.n);
    } else if(chance(0.35)){
      s.sick={type:'síndrome pós-concussional',weeksLeft:rn(2,5)};
      d.note=(d.note?d.note+' ':'')+'Trauma: '+s.sick.type+'.';
      addEvent(s.sick.type);
    }
  }

  if(s.stage>=2){
    for(let i=0;i<15;i++)if(chance(.15))s.rk[i]=nm();
  }

  s.h.unshift({o:o.n+(o.nick?' "'+o.nick+'"':''),w,m:d.method,rd:d.rd,t:STAGE[s.champ?3:s.stage],y:Math.floor(s.age),purse});
  s.h=s.h.slice(0,80);

  if(w&&chance(0.2+s.fame/250))trySponsorOffer();

  // XP: vitórias dão bastante; finalizações bônus; derrota dá pouco
  let xpGain=0;
  if(w){
    xpGain=28+s.stage*8+(isFin?12:0)+(o.title?25:0)+Math.max(0,o.rating-50);
    if(F&&F.qteBonus)xpGain+=F.qteBonus;
  } else {
    xpGain=8+s.stage*2;
  }
  gainXP(Math.round(xpGain*diff().xp), w?'vitória':'derrota');

  // Luta cumprida
  if(S.calendar)S.calendar.unshift({type:'fought',label:(w?'V':'D')+' vs '+o.n,week:S.week,season:S.season,purse:purse});
  const completedBooking=S.booked;
  const wasComp=completedBooking&&completedBooking.fromComp;
  if(completedBooking&&completedBooking.ufcContract)ufcApplyResult(w,o,completedBooking);
  S.booked=null;
  // Luta avança o calendário (1–3 semanas; torneio usa o próprio espaçamento depois)
  tickWeek(wasComp?rn(1,2):rn(2,4),{fromFight:true,silent:true});
  S.opp=null;
  if(wasComp&&S.competition) advanceCompAfterFight(w);
  checkUfcTransition(w,!!wasComp);
  if(ufcState().signed&&!S.booked)genUfcOffers(true);
  else if(!ufcState().signed&&!S.booked)genFightOffers(true);
  S.agentMood=cl((S.agentMood||70)+(w?rn(2,6):-rn(1,4)),10,100);
  save();ui();
}

function trySponsorOffer(){
  if(S.sponsorOffer)return;
  const avail=MASTER_SPONSORS.filter(sp=>S.fame>=sp.minFame&&S.stage>=sp.minStage&&S.w>=sp.reqW&&(!S.masterSponsor||sp.pay>S.masterSponsor.pay));
  if(!avail.length)return;
  const better=avail.filter(sp=>!S.masterSponsor||sp.name!==S.masterSponsor.name).sort((a,b)=>b.pay-a.pay);
  if(!better.length)return;
  S.sponsorOffer=better[0];
  addEvent('Oferta master: '+S.sponsorOffer.name);
}

let _timeLock=0;
function timeBusy(){const n=Date.now();if(n-_timeLock<700)return true;_timeLock=n;return false}
function fightThisWeek(){return !!(S&&S.booked&&canFightNow()&&!injuryActive()&&!sickActive())}
function guardTime(go){
  if(!S||S.dead||S.retired)return;
  if(timeBusy())return;
  if(!fightThisWeek()){go();return}
  const b=S.booked;_timeLock=0;

}
function rest(){
  if(!S||S.dead||S.retired)return;
  restOneWeek();
}
function restOneWeek(){
  if(!S)return;
  if(fightThisWeek()){
    toast('Sua luta é nesta semana! Não descanse: lute agora ou cancele/adiar a luta.');
    return;
  }
  tickWeek(1,{silent:true});
  recoverRest();
  save();ui();

}
function recoverRest(){
  S.fatigue=cl(S.fatigue-rn(18,30),0,100);
  S.form=cl(S.form+rn(3,8),15,100);
  S.morale=cl(S.morale+rn(1,4),5,100);
}
function restUntilFight(){
  if(!S||S.dead||S.retired)return;
  if(!S.booked){toast('Você ainda não tem luta marcada. Use “Descansar até energia completa”.');return;}
  if(fightThisWeek()){
    toast('Sua luta é nesta semana! Não avance o calendário.');return;
  }
  let weeks=0;
  while(S.booked && !canFightNow() && weeks<260){
    // Para exatamente na semana da luta; nunca avança além da data marcada.
    tickWeek(1,{silent:true});
    recoverRest();
    weeks++;
  }
  save();ui();
  if(canFightNow())toast('Pronto para a luta! Chegou à semana marcada. Fadiga: '+S.fatigue+'%.');
  else toast('Não foi possível chegar à semana da luta. Confira o calendário.');
}
function restUntilFull(){
  if(!S||S.dead||S.retired)return;
  if(S.fatigue<=0){toast('Energia já está completa!');return;}
  if(fightThisWeek()){
    toast('Sua luta é nesta semana! Não avance o calendário.');return;
  }
  let weeks=0,stoppedForFight=false;
  while(S.fatigue>0 && weeks<260){
    // Não deixa o descanso ultrapassar uma luta marcada.
    if(canFightNow()){stoppedForFight=true;break;}
    tickWeek(1,{silent:true});
    recoverRest();
    weeks++;
    if(canFightNow() && S.fatigue>0){stoppedForFight=true;break;}
  }
  save();ui();
  if(S.fatigue<=0)toast('Energia completa! Descansou '+weeks+' semana(s).');
  else if(stoppedForFight)toast('Descanso interrompido: sua luta chegou. Fadiga restante: '+S.fatigue+'%.');
  else toast('Descanso interrompido. Fadiga: '+S.fatigue+'%.');
}

function upgradeCoach(){

function signSmallSponsor(id){

}
function manageSponsorshipsByManager(){
  if(!S||!S.manager||S.manager.discovered||S.manager.scamActive)return;
  const mgr=S.manager;let actions=[];
  // Renegocia o Master quando há uma oferta realmente melhor e os requisitos já foram cumpridos.
  const masterChoices=MASTER_SPONSORS.filter(sp=>S.fame>=sp.minFame&&S.stage>=sp.minStage&&S.w>=sp.reqW&&(!S.masterSponsor||sp.pay>S.masterSponsor.pay)).sort((a,b)=>b.pay-a.pay);
  if(masterChoices.length){
    const sp=masterChoices[0];
    const old=S.masterSponsor&&S.masterSponsor.name;
    S.masterSponsor={name:sp.name,pay:sp.pay,season:S.season,managedBy:mgr.id};
    S.sponsors=[{name:sp.name,pay:sp.pay,season:S.season}];
    const signingBonus=Math.round(sp.pay*0.05);S.money+=signingBonus;S.fame+=1;
    actions.push((old?'renovou/trocou '+old+' por ':'fechou contrato Master com ')+sp.name+' (bônus '+usd(signingBonus)+')');
    addEvent('Empresário negociou contrato Master: '+sp.name+'. Bônus '+usd(signingBonus)+'.');
    S.sponsorOffer=null;
  } else if(S.masterSponsor&&(S.masterSponsor.season||S.season)<S.season){
    // Renovação anual automática quando ainda não existe uma marca melhor elegível.
    S.masterSponsor.season=S.season;S.masterSponsor.managedBy=mgr.id;
    const renewalBonus=Math.round(S.masterSponsor.pay*0.02);S.money+=renewalBonus;
    actions.push('renovou o Master '+S.masterSponsor.name+' por mais uma temporada (bônus '+usd(renewalBonus)+')');
    addEvent('Empresário renovou o Master '+S.masterSponsor.name+' por mais uma temporada. Bônus '+usd(renewalBonus)+'.');
  }
  // Preenche vagas de patrocínios menores com acordos que cabem no perfil do atleta.
  if(!S.smallContracts)S.smallContracts=[];
  while(S.smallContracts.length<3){
    const options=SMALL_SPONSORS.filter(sp=>S.fame>=sp.minFame&&S.stage>=sp.minStage&&!S.smallContracts.some(c=>c.id===sp.id))
      .sort((a,b)=>((b.pay*13+b.bonus/b.weeks)-(a.pay*13+a.bonus/a.weeks)));
    if(!options.length)break;
    const sp=options[0];
    const c={...sp,weeksLeft:sp.weeks,progress:0,startSeason:S.season,startWeek:S.week,managedBy:mgr.id};
    S.smallContracts.push(c);const signingBonus=Math.round(sp.pay*0.35);S.money+=signingBonus;
    actions.push('assinou '+sp.name+' por '+sp.weeks+' semanas');
    addEvent('Empresário fechou contrato menor com '+sp.name+'. Adiantamento '+usd(signingBonus)+'.');
    // Um contrato por revisão para evitar preencher todas as vagas com acordos longos em um único clique.
    break;
  }

function buyLuxury(id){
  const item=LUXURY.find(x=>x.id===id);if(!item)return;
  if((S.assets||[]).find(x=>x.id===id)){toast('Já tem isso.');return}
  if(S.money<item.price){toast('Sem dinheiro.');return}
  if(!S.assets)S.assets=[];
  S.money-=item.price;S.assets.push({...item});soundPurchase();

function advanceWeek(){guardTime(doAdvance)}
function doAdvance(){
  if(!S||S.retired||S.dead)return;
  syncBookedDate();
  // Bloqueio definitivo: avançar o calendário nunca pode gerar no-show ou multa.
  if(S.booked && canFightNow()){
    const why=injuryActive()?'lesão':sickActive()?'doença':null;
    if(why)postponeFight(S.booked,why);
    else {save();tab='agt';ui();toast('⚠️ Sua luta contra '+S.booked.opp.n+' está disponível agora. Entre no octógono antes de avançar.');return;}
  }
  tickWeek(1);
  if(S.age>=40){retire('Limite de idade (40 anos)');return}
  save();ui();
  if(S.booked && S.season===S.booked.season && S.week===S.booked.week)toast('🥊 Semana da luta! Enfrente '+S.booked.opp.n+' antes de avançar novamente.');
  else toast('Semana '+S.week+' · Temporada '+S.season);
}

  if(!S||S.retired||S.dead)return;
  S.booked=null;S.opp=null;S.competition=null;S.fightOffers=[];S.compOffers=[];S.sponsorOffer=null;
  if(F){try{clearTimeout(F._qteT)}catch(e){}F=null}

  S.retireReason=reason||'Decisão própria';
  addEvent('Aposentadoria: '+S.retireReason);
  save();
  tab='his';
  ui();
  showRetireReport();
}

  box(280,180,'Nocautes na carreira',s.ko||0);box(490,180,'Fans',Math.round(s.fans||0).toLocaleString('pt-BR'));box(700,180,'Nível XP',s.xpLevel||1);
  box(280,255,'Patrimônio',usd(s.money));box(490,255,'Temporadas',s.season||1);box(700,255,'Lutas',s.w+s.l+(s.d||0));

  // Saldo de cartel por temporada: vitórias menos derrotas naquela temporada.
  const bouts=(s.calendar||[]).filter(e=>e.type==='fought'&&e.season!=null&&/^(V|D)\s/.test(e.label||''));
  const per={};
  bouts.forEach(e=>{const yr=Math.max(1,Number(e.season)||1);if(!per[yr])per[yr]=0;per[yr]+=(String(e.label).startsWith('V')?1:-1)});
  // Compatibilidade com carreiras antigas sem histórico completo no calendário.

  ctx.textAlign='left';ctx.fillStyle='#facc15';ctx.font='bold 14px system-ui';ctx.fillText('● Saldo acumulado: '+(cumulative[cumulative.length-1]>=0?'+':'')+(cumulative[cumulative.length-1]||0),40,700);

function scrollNav(dir){
  const sc=$('navScroll');if(!sc)return;
  sc.scrollBy({left:dir*Math.max(160,sc.clientWidth*0.55),behavior:'smooth'});
  setTimeout(updateNavArrows,280);
}
function updateNavArrows(){
  const sc=$('navScroll'),prev=$('navPrev'),next=$('navNext');
  if(!sc||!prev||!next)return;
  const max=sc.scrollWidth-sc.clientWidth-2;
  prev.disabled=sc.scrollLeft<=2;
  next.disabled=sc.scrollLeft>=max;
  // hide arrows if no overflow
  const need=sc.scrollWidth>sc.clientWidth+4;
  prev.style.display=next.style.display=need?'':'none';
}

        <h3>Gastar XP (garantido)</h3>
        ${AT.map(([k,l])=>{const cost=s.a[k]>=90?3:s.a[k]>=85?2:1;return `<div class="row"><span>${l}: <b>${s.a[k]}</b> <small class="m">${cost} pt</small></span>
          <button ${(s.xpPoints||0)>=cost&&s.a[k]<99&&!blocked()?'':'disabled'} onclick="spendXPPoint('${k}')">+1 XP</button></div>`}).join('')}
        <h3>Treino de camp (pode falhar)</h3>
        ${AT.map(([k,l])=>{const ch=Math.round(trainChance(s.a[k])*100);return `
          <div class="row">
            <span>${l}: <b>${s.a[k]}</b> <small class="m">(${ch}%)</small>
              <div class="bar" style="width:100px;display:inline-block;margin-left:8px;vertical-align:middle">
                <i style="width:${s.a[k]}%"></i>
              </div>
            </span>
            <button ${s.pts&&s.a[k]<99&&!blocked()?'':'disabled'} onclick="train('${k}')">Treinar</button>
          </div>`}).join('')}
        <div class="acts" style="margin-top:16px">
          <button onclick="rest()">😴 Descansar 1 semana</button>
          <button onclick="restUntilFight()">📅 Descansar até próxima luta</button>
          <button onclick="restUntilFull()">⚡ Descansar até energia completa</button>
          <button onclick="upgradeCoach()">📈 Coach (${(s.coachLvl||0)>=COACH_LVLS.length-1?'máx.':usd(COACH_LVLS[(s.coachLvl||0)+1].cost)+' → '+COACH_LVLS[(s.coachLvl||0)+1].name})</button>
        </div>
      </div>
      <div class="card">
        <h3>Dicas de estilo</h3>
        <p class="m">${Object.keys(STY_INFO).map(k=>'<b>'+k+'</b>: '+STY_INFO[k]).join('<br>')}<br>Cardio alto reduz fadiga.</p>
      </div>
    </div>`;
  }

  /* ---- RANKING ---- */
  if(tab==='rnk'){
    // Pool persistente: os mesmos atletas, idades, cartéis e OVRs reaparecem
    // entre visitas à aba, em vez de sortear uma lista nova a cada renderização.
    if(!s.rankPools || typeof s.rankPools!=='object') s.rankPools={};
    const tierDefs=[
      {id:'local',name:'🏘️ Divisão Local',desc:'Circuitos locais · OVR típico 25–45',min:0,base:27,top:45,qual:0,rows:15},
      {id:'regional',name:'🗺️ Divisão Regional',desc:'Circuito regional · OVR típico 38–60',min:38,base:38,top:60,qual:38,rows:15},
      {id:'national',name:'🇧🇷 Divisão Nacional',desc:'Principais nomes do país · OVR típico 52–76',min:52,base:52,top:76,qual:52,rows:15},
      {id:'world',name:'🌎 Divisão Mundial',desc:'Elite internacional · OVR típico 70–92',min:70,base:70,top:92,qual:75,rows:15}
    ];
    const makePool=(t)=>{
      const arr=[];
      for(let j=0;j<t.rows;j++){
        const rating=cl(Math.round(t.top-(t.top-t.base)*(j/(t.rows-1))+rn(-2,2)),t.base,t.top);
        const age=rn(20,38);
        const careerYears=Math.max(0,age-rn(18,23));
        const wins=cl(rn(1,5)+careerYears*rn(0,2),0,34);
        const losses=cl(Math.round(careerYears*(Math.random()*.65)),0,18);
        const draws=Math.random()<.18?1:0;
        arr.push({id:t.id+'_'+j,name:nm(),nationality:pk(NATIONALITIES).v,age,rating,
          w:wins,l:losses,d:draws,rank:0});
      }
      return arr;
    };
    tierDefs.forEach(t=>{if(!Array.isArray(s.rankPools[t.id])||s.rankPools[t.id].length<10)s.rankPools[t.id]=makePool(t)});
    save(); // conserva atletas gerados, idades e cartéis ao recarregar a carreira
    const meRating=ovr();
    const qualifies=t=>t.id==='local'||meRating>=t.qual||(t.id==='regional'&&s.sw>=2)||(t.id==='national'&&s.stage===1);
    let L='';
    tierDefs.forEach(t=>{
      const eligible=qualifies(t);
      L+=`<div class="card"><h3>${t.name}</h3><p class="m">${t.desc}</p>`;
      if(!eligible){
        L+=`<div class="notice">Você ainda não se classificou para esta divisão. Requisito sugerido: OVR ${t.qual}+; sua avaliação atual é ${meRating}.</div></div>`;
        return;
      }
      const pool=s.rankPools[t.id].map(x=>({...x}));
      // O lutador aparece em todas as divisões para as quais o nível é suficiente,
      // independentemente da etapa formal da carreira.
      const player={id:'player',name:s.name+' (você)',nationality:s.nationality||'BR',age:Math.floor(s.age||24),rating:meRating,w:s.w||0,l:s.l||0,d:s.d||0,player:true};
      const rows=pool.concat(player).sort((a,b)=>b.rating-a.rating||((b.w-b.l)-(a.w-a.l)));
      rows.forEach((f,idx)=>{
        const rank=idx+1;
        const nat=nationalityByCode(f.nationality);
        const record=`${f.w}-${f.l}${f.d?'-'+f.d:''}`;
        L+=`<div class="row ${f.player?'me':''}"><span><b>#${rank} ${f.name}</b> <small class="m">${nat.flag} · ${f.age} anos · ${record}</small></span><span class="m">OVR ${f.rating}</span></div>`;
      });
      if(t.id==='world'&&s.stage<2)L+=`<p class="m">Você aparece aqui pelo nível técnico, mas isso não significa contrato com o UFC. A etapa profissional da carreira continua separada do ranking por OVR.</p>`;
      L+='</div>';
    });
    html=`<div class="page active"><div class="card"><h2>📊 Rankings por divisão</h2><p>As divisões são independentes e um atleta pode aparecer em mais de uma quando seu OVR é suficiente. Os adversários têm idade, nacionalidade, cartel e nível persistentes. Seu OVR atual é <b>${meRating}</b>; estar na etapa UFC não coloca automaticamente um lutador de OVR baixo entre a elite mundial.</p><div class="row"><b>Seu perfil</b><span>${nationalityByCode(s.nationality).flag} ${nationalityByCode(s.nationality).n} · ${Math.floor(s.age||24)} anos · ${s.w}-${s.l} · OVR ${meRating}</span></div></div>${L}</div>`;
  }

  /* ---- PATROCÍNIOS ---- */
  if(tab==='spon'){
    html=`<div class="page active">
      <div class="card">
        <h2>💼 Patrocinador Master</h2>
        <p class="m">Fama: <b>${s.fame}</b>. O Master ocupa 1 espaço e paga por temporada.</p>
        ${s.masterSponsor?`<div class="row"><b>${s.masterSponsor.name}</b><span class="w">${usd(s.masterSponsor.pay)} / temporada · ativo</span></div>`:'<p class="m">Sem contrato Master ativo.</p>'}
        ${s.sponsorOffer?`<div class="notice good">Oferta Master: <b>${s.sponsorOffer.name}</b> — ${usd(s.sponsorOffer.pay)} por temporada<br><button class="pri" onclick="acceptSponsor()">Aceitar</button> <button onclick="rejectSponsor()">Recusar</button></div>`:''}
        ${MASTER_SPONSORS.map(sp=>{const has=s.masterSponsor&&s.masterSponsor.name===sp.name;const ok=s.fame>=sp.minFame&&s.stage>=sp.minStage&&s.w>=sp.reqW;return `<div class="row"><span>${sp.name} <small class="m">(fama ${sp.minFame}+, ${sp.reqW} vit.)</small></span><span class="${has?'w':ok?'y':'m'}">${has?'Ativo':ok?'Elegível':'Bloqueado'} · ${usd(sp.pay)}</span></div>`}).join('')}
      </div>
      <div class="card">
        <h2>📄 Contratos menores</h2><p class="m">Contratos com duração, pagamento periódico e bônus por meta. Você pode manter até 3 ativos; assinar rende adiantamento de 50% do valor semanal.</p>
        ${(s.smallContracts||[]).length?(s.smallContracts||[]).map(c=>`<div class="row"><span><b>${c.name}</b><small class="m" style="display:block">Meta: ${c.progress||0}/${c.wins} vitórias · ${c.weeksLeft} semanas restantes</small><small class="m">Bônus: ${usd(c.bonus)} · ${c.kind||'patrocínio'}</small></span><span class="w">${usd(c.pay)} / 4 semanas</span></div>`).join(''):'<p class="m">Nenhum contrato menor ativo.</p>'}
        <h3>Ofertas disponíveis</h3>
        ${SMALL_SPONSORS.map(sp=>{const active=(s.smallContracts||[]).some(x=>x.id===sp.id);const ok=s.fame>=sp.minFame&&s.stage>=sp.minStage;return `<div class="row"><span><b>${sp.name}</b><small class="m" style="display:block">${sp.weeks} semanas · ${sp.wins} vitória(s) · bônus ${usd(sp.bonus)}</small><small class="m">Requisito: fama ${sp.minFame}+ · ${['Regional','Contender','UFC'][sp.minStage]||'UFC'}</small></span><span>${active?'<b class="w">Ativo</b>':`<button ${!ok||(s.smallContracts||[]).length>=3?'disabled':''} onclick="signSmallSponsor('${sp.id}')">${ok?'Assinar':'Bloqueado'} · ${usd(sp.pay)}/4 sem.</button>`}</span></div>`}).join('')}
      </div>
      <div class="card">
        <h2>🧑‍💼 Empresário</h2><p class="m">Ele revisa os contratos a cada 4 semanas, tenta renovar/trocar seu Master por um melhor e fecha patrocínios menores quando há vagas. Também cobra salário e comissão; alguns podem ser desonestos.</p>
        ${s.manager?`<div class="notice ${s.manager.discovered?'warn':'good'}"><b>${s.manager.name}</b><br>Salário: ${usd(s.manager.salary)} a cada 4 semanas · Comissão: ${Math.round((s.manager.cut||0)*100)}% das bolsas<br>${s.manager.discovered?'Golpe descoberto. O esquema foi interrompido.':s.manager.scamActive?'Há movimentações financeiras suspeitas, mas você ainda não tem provas.':`Contratos negociados: ${s.manager.dealsClosed||0}<br>Última revisão (${s.manager.lastReview||'—'}): ${s.manager.lastAction||'Aguardando revisão.'}`}<br><button onclick="fireManager()">Encerrar contrato</button></div>`:`<p class="m">Você ainda não contratou um empresário.</p>${MANAGERS.map(m=>`<div class="row"><span><b>${m.name}</b><small class="m" style="display:block">${m.desc} Comissão: ${Math.round(m.cut*100)}%</small></span><button ${s.money<m.salary*2?'disabled':''} onclick="hireManager('${m.id}')">Contratar · ${usd(m.salary)}/4 sem.</button></div>`).join('')}`}
      </div>
      ${(s.sponsorHistory||[]).length?`<div class="card"><h3>📚 Contratos anteriores</h3>${s.sponsorHistory.map(c=>`<div class="row"><span>${c.name}</span><span class="${c.success?'w':'d'}">${c.success?'Meta cumprida':'Meta não cumprida'}</span></div>`).join('')}</div>`:''}
    </div>`;
  }

  /* ---- HISTÓRICO ---- */
  
  if(tab==='lux'){
    html=`<div class="page active">
      <div class="card">
        <h2>💎 Mercado de luxo</h2>
        <p class="m">Saldo: <b>${usd(s.money)}</b> · Escândalo: ${s.life.scandal||0}/100</p>
        ${LUXURY.map(item=>{
          const owned=(s.assets||[]).find(x=>x.id===item.id);
          return `<div class="row"><span><b>${item.name}</b> <small class="m">${item.cat}${item.fame?' · +'+item.fame+' fama':''}${item.scandal?' · escândalo +'+item.scandal:''}</small></span>
            <span>${owned?'<span class="w">Adquirido</span>':`<button ${s.money>=item.price?'':'disabled'} onclick="buyLuxury('${item.id}')">${usd(item.price)}</button>`}</span></div>`;
        }).join('')}
      </div>
      <div class="card"><h3>Seus bens</h3>
        ${(s.assets&&s.assets.length)?s.assets.map(x=>`<div class="row"><span>${x.name}</span><span class="m">${x.cat}</span></div>`).join(''):'<p class="m">Nada ainda.</p>'}
      </div>
    </div>`;
  }

  if(tab==='his'){
    html=`<div class="page active">
      <div class="card">
        <h2>📜 Histórico de lutas</h2>
        ${s.h.length?s.h.map(x=>`
          <div class="row">
            <span class="${x.w?'w':'d'}">${x.w?'Vitória':'Derrota'} vs ${x.o}</span>
            <span class="m">${x.m} R${x.rd} · ${x.t} · ${usd(x.purse||0)}</span>
          </div>`).join(''):'<p class="m">Nenhuma luta ainda.</p>'}
      </div>
      <div class="card">
        <h3>Eventos da carreira</h3>
        ${s.events.length?s.events.slice(0,20).map(e=>`<div class="row"><span>${e.t}</span><span class="m">T${e.s} · ${e.a} anos</span></div>`).join(''):'<p class="m">Nenhum evento registrado.</p>'}
      </div>
      <div class="card">
        <p>
          <button class="danger" type="button" onclick="askConfirm('Aposentar agora?','Sua carreira será encerrada e você verá o relatório final. Isso não pode ser desfeito.','Aposentar-se',()=>retire('Decisão própria'))">Aposentar-se</button>
          <button onclick="if(confirm('Apagar a carreira e começar outra?')){S=null;localStorage.removeItem(KEY);ui()}">Nova carreira</button>
        </p>
      </div>
    </div>`;
  }

  /* ---- RELACIONAMENTOS ---- */
  if(tab==='rel'){
    html=renderRelationships();
  }

  /* ---- VIDA ---- */
  if(tab==='life'){
    html=`<div class="page active">
      <div class="card">
        <h2>❤️ Vida pessoal</h2>
        <div class="grid">
          ${st('Parceiro(a)',s.life.partner||'Solteiro(a)')}
          ${st('Filhos',s.life.kids)}
          ${st('Escândalos',s.life.scandal)}
          ${st('Moral',s.morale+'%')}
        </div>
        <h3>📊 Idade & carreira</h3>
        <div class="grid">
          ${st('Idade',Math.floor(s.age)+' anos')}
          ${st('Temporada',s.season||1)}
          ${st('Semana',s.week||1)}
          ${st('Semanas totais',s.weekTotal||0)}
          ${st('Pico OVR',s.peakOvr)}
          ${st('OVR atual',ovr())}
          ${st('Dificuldade',diff().label)}
          ${st('Modo',(s.fightMode||'classic')==='dynamic'?'Dinâmico':'Clássico')}
          ${st('Nível XP',s.xpLevel||1)}
          ${st('Lutas',(s.w+s.l))}
        </div>
        <p class="m" style="margin-top:12px">Declínio natural após os 31. Eventos de vida ao avançar semanas. Moral alta melhora o desempenho.</p>
        <h3>Academia & equipe</h3>
        <p>Academia: <b>${s.gym}</b><br>Coach: <b>${s.coach}</b> (bônus de luta: +${s.coachBonus})</p>
        <button onclick="upgradeCoach()">Melhorar coach</button> <button class="danger" onclick="if(confirm('Encerrar definitivamente esta carreira e gerar o relatório de legado?'))retire('Aposentadoria voluntária')">🏁 Aposentar-se</button>
      </div>
      <div class="card">
        <h3>Títulos conquistados</h3>
        ${s.titles.length?s.titles.map(t=>`<div class="row"><span>🏆 ${t.name}</span><span class="m">Temporada ${t.season}</span></div>`).join(''):'<p class="m">Nenhum cinturão ainda.</p>'}
      </div>
    </div>`;
  }

  m.innerHTML=html;
}

(function(){
  const sc=$('navScroll');
  if(sc)sc.addEventListener('scroll',()=>updateNavArrows(),{passive:true});
  addEventListener('resize',()=>updateNavArrows());
})();
ui();
</script>
</body>
</html>
